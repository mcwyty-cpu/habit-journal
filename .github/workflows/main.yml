name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found - were all the project files uploaded?"; ls -la; exit 1; fi
          cd "$(dirname "$SETTINGS")"
          echo "Building in: $(pwd)"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HabitJournal.apk"

      - name: Keep a copy with the build
        uses: actions/upload-artifact@v4
        with:
          name: HabitJournal-apk
          path: HabitJournal.apk

      - name: Publish to Releases for easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HabitJournal.apk \
            --title "Habit Journal" \
            --notes "Tap HabitJournal.apk below to download it, then open it on your phone to install."
